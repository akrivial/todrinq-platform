<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 68" fill="none">
  <defs>
    <linearGradient id="wn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38c2e8"/>
      <stop offset="100%" stop-color="#0072b1"/>
    </linearGradient>
  </defs>
  <!-- Waternet pinwheel — 4 curved blades -->
  <!-- Blade 1 (top-right) -->
  <path d="M34 10 C42 10 48 16 48 26 C48 30 46 33 43 35 C40 37 36 37 33 35 C28 32 26 26 28 20 C30 14 32 10 34 10Z" fill="url(#wn-grad)" opacity="0.95"/>
  <!-- Blade 2 (bottom-right) -->
