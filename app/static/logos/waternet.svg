  <!-- Blade 3 (bottom-left) -->
  <path d="M34 10 C42 10 48 16 48 26 C48 30 46 33 43 35 C40 37 36 37 33 35 C28 32 26 26 28 20 C30 14 32 10 34 10Z" fill="url(#wn-grad)" transform="rotate(180,34,34)"/>
  <!-- Blade 4 (top-left) -->
  <path d="M34 10 C42 10 48 16 48 26 C48 30 46 33 43 35 C40 37 36 37 33 35 C28 32 26 26 28 20 C30 14 32 10 34 10Z" fill="url(#wn-grad)" opacity="0.85" transform="rotate(270,34,34)"/>
  <!-- White center disc -->
  <circle cx="34" cy="34" r="9" fill="white"/>
  <circle cx="34" cy="34" r="5" fill="url(#wn-grad)" opacity="0.4"/>
  <!-- Text -->
  <text x="66" y="34" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#0072b1" letter-spacing="-0.3">waternet</text>
  <text x="66" y="52" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0098d4" letter-spacing="0.5">gemeente amsterdam</text>
